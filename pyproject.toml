[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "arcana-tarot"
description = "Implementation of the Arcana Land tarot deck specification"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Fidel", email = "adam@arcana.land" }]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
keywords = ["tarot", "tarot-deck", "esoterica", "tarot-spread", "cards"]

[project.urls]
Homepage = "https://arcana.land"
Repository = "https://github.com/arcanaland/libarcana"
Issues = "https://github.com/arcanaland/libarcana/issues"

[tool.scikit-build]
cmake.version = ">=4.3"
wheel.packages = []

# Tag the wheel abi3 to match nanobind's STABLE_ABI build. cp312 is the floor
# declared above, so one wheel covers 3.12 and every later interpreter.
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
ARCANA_BUILD_PYTHON = "ON"
ARCANA_BUILD_TESTS = "OFF"
ARCANA_INSTALL = "OFF"
ARCANA_INSTALL_PYTHON_MODULE = "ON"

[tool.cibuildwheel]
# One build, not a matrix: the module is abi3 (see wheel.py-api above), so the
# cp312 wheel serves every later interpreter too. Linux x86-64 only for now —
# that is what both named consumers run, and macOS/Windows are a porting
# question rather than a CI flag while the library is GCC-only C++26.
build = "cp312-manylinux_x86_64"
build-frontend = "build"

# Pinned rather than left to the default, which has changed before. This is the
# image measured to carry GCC 14.2.1, which compiles the project's C++26.
manylinux-x86_64-image = "manylinux_2_28"

test-command = "python {project}/tools/check_wheel_import.py"

# Grab the real version from CMakeLists.txt
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = '''project\(\s+arcana\s+VERSION\s+(?P<value>[0-9][0-9.]*)'''
