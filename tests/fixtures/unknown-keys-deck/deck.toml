# A deck.toml carrying keys and a whole section that no parser in libarcana names --
# standing in for a deck authored against a future spec version. Everything here must
# survive a load and come back out of deck::source_toml.
[deck]
id = "unknown-keys-deck"
schema_version = "1.0"
name = "Unknown Keys Deck"
version = "1.0"
future_v11_field = "kept"

[future_v11_section]
nested_key = 42
