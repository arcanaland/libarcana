# - a `pattern` relation whose target is in the `deck` type segment
# - a `companion` relation into `deck/`, which is where it belongs
[deck]
schema_version = "2.0"
name = "Pattern Target"
version = "1.0"
identifier = "org.example/deck/pattern-target"
related = [
  { rel = "pattern", target = "land.arcana/deck/rider-waite-smith" },
  { rel = "companion", target = "com.example/deck/oracle" },
]
