# - two `expands` relations where the specification allows one
# - the `companion` relation is unbounded, so two of those are fine
[deck]
schema_version = "2.0"
name = "Twice Expanding"
version = "1.0"
identifier = "org.example/deck/twice-expanding"
related = [
  { rel = "expands", target = "land.arcana/deck/rider-waite-smith" },
  { rel = "companion", target = "com.example/deck/one" },
  { rel = "expands", target = "com.example/deck/other" },
  { rel = "companion", target = "com.example/deck/two" },
]
