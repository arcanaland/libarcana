# A deck does not follow itself. `follows` here repeats `identifier`; the
# `signifies` arm of the same rule is the other way it can be written.
[deck]
schema_version = "2.0"
name = "Follows Itself"
version = "1.0"
identifier = "org.example/deck/follows-itself"
follows = "org.example/deck/follows-itself"
