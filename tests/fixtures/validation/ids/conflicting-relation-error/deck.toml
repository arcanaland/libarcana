# - two `pattern` relations where the specification allows one
# - a `surrogate_for` beside them, which is bounded on its own and conflicts
#   with neither
[deck]
schema_version = "2.0"
name = "Conflicting Relations"
version = "1.0"
identifier = "org.example/deck/conflicting-relations"
related = [
  { rel = "pattern", target = "land.arcana/pattern/rider-waite-smith" },
  { rel = "pattern", target = "land.arcana/pattern/thoth" },
  { rel = "surrogate_for", target = "com.example/deck/other" },
]
