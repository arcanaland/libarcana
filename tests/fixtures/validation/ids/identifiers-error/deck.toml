# - A bare label is not a realm
# - `also_bad` has no slash
# - a `pattern` relation names a deck, so it too must be a qualified identifier
# - [app] subtable key is unquoted
[deck]
schema_version = "2.0"
name = "Bad Identifiers"
version = "1.0"
identifier = "notarealm/deck/bad-identifiers"
related = [
  { rel = "surrogate_for", deck = "also_bad" },
  { rel = "pattern", deck = "rider-waite-smith" },
]

[app.land.arcana]
bleed = true
