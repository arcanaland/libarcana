name: Release

# TestPyPI is reachable by hand at any time; PyPI fires only from a published
# GitHub release. RFC-019 §4 requires TestPyPI first and this shape enforces it
# rather than trusting the operator to remember.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts to TestPyPI
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Build manylinux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configuration lives in pyproject.toml's [tool.cibuildwheel], so it is
      # identical to what runs locally.
      - uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels
          path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the sdist
        run: pipx run build --sdist

      # The sdist is the fallback for any platform the wheel matrix misses, so
      # a broken one is worse than none. Building it in a clean venv, outside
      # the repo, is the only thing that proves it carries enough of the tree.
      - name: Build a wheel from the sdist alone
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip
          mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/*/
          /tmp/sdist-venv/bin/pip install -v .
          cd /tmp
          /tmp/sdist-venv/bin/python -c "import arcana_tarot; print(arcana_tarot.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # The version is single-sourced from CMakeLists.txt, so a release tag can
  # disagree with what actually gets published. PyPI will not let a version be
  # re-uploaded, so catching this before the publish is the only cheap moment.
  check-version:
    name: Check tag matches project version
    needs: [sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - name: Compare
        run: |
          set -euo pipefail
          sdist=$(basename dist/*.tar.gz)
          built=${sdist#arcana_tarot-}
          built=${built%.tar.gz}
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::release tag $tag does not match project version $built from CMakeLists.txt"
            exit 1
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # the OIDC token; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a rehearsal space and a version cannot be re-uploaded,
          # so a repeated dry run of the same version must not fail the job.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist, check-version]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
