name: macOS floor

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/macos-*.yml
      - pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Skip if this commit already passed
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/macos-floor.yml/runs?head_sha=$SHA&status=success&per_page=1" \
            --jq '.total_count')
          echo "successful runs on $SHA: $passed"
          if [ "$passed" -gt 0 ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
