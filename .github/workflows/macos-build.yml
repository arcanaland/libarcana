name: macOS wheel build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  wheel:
    name: Build macOS arm64 wheel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang++ --version

      - uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
